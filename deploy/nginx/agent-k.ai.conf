# Nginx Proxy Manager — agent-k.ai custom location blocks
#
# Paste this whole file into the "Custom Nginx Configuration" textarea
# under your `agent-k.ai` proxy host's Advanced tab in NPM. NPM regenerates
# the host conf and reloads nginx automatically when you save.
#
# Two location blocks, in this order. Nginx matches the LONGEST prefix
# first, so `location /v1/ws` catches the WebSocket upgrade BEFORE the
# catch-all `location /v1/` block grabs it as a regular HTTP request.

# ─────────────────────────────────────────────────────────────────────
# WebSocket — /v1/ws (live market data stream)
# ─────────────────────────────────────────────────────────────────────
#
# The two `proxy_set_header Upgrade` / `Connection` lines are what
# actually turn this from a regular HTTP proxy into a WebSocket proxy.
# NPM's "Websockets Support" toggle adds these to its DEFAULT proxy
# block, but custom location blocks override the default and need them
# explicitly. That's why /v1/ws was returning HTTP 404 before — the
# upgrade headers never reached FastAPI, so the WS route wasn't matched.
#
# `proxy_read_timeout 3600s` — the server sends a heartbeat every 30s
# but the connection should survive longer idle gaps. 1 hour is a sane
# upper bound; the server will close on missed heartbeats anyway.
location /v1/ws {
    proxy_pass http://192.168.222.222:4311;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    proxy_buffering off;
}

# ─────────────────────────────────────────────────────────────────────
# REST — /v1/ (everything else under /v1/)
# ─────────────────────────────────────────────────────────────────────
#
# Unchanged from the original config. 120s timeouts cover long-running
# LLM chat completions; request buffering off keeps Stripe webhook raw
# bodies intact.
location /v1/ {
    proxy_pass http://192.168.222.222:4311;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stripe webhook needs raw body — don't buffer
    proxy_request_buffering off;
    proxy_buffering off;

    # Generous timeouts for LLM chat completions
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
