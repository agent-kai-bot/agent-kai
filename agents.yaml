version: 1

executors:
  codex:
    provider: codex-cli
    endpoint: codex-cli
    # Default codex model — Dan's hard rule: gpt-5.5 is the floor, do NOT
    # downgrade to 5.4 (see memory: 2026-05-06_dan_default_codex_model_is_5_5).
    model: gpt-5.5
    health_probe:
      command: "echo healthy"
      interval_seconds: 60
      timeout_seconds: 10
    capacity_feedback_codes: [429, 503]
    cooldown_seconds: 300
    overflow_executor: claude

  claude:
    provider: claude-cli
    model: sonnet
    health_probe:
      command: "echo healthy"
      interval_seconds: 60
      timeout_seconds: 10
    capacity_feedback_codes: [429, 503]
    cooldown_seconds: 300
    overflow_executor: codex

  local-llm:
    provider: openai
    endpoint: kai-local
    model: qwen35-gptq
    health_probe:
      command: "echo healthy"
      interval_seconds: 60
      timeout_seconds: 10
    capacity_feedback_codes: [429, 503]
    cooldown_seconds: 300
    overflow_executor: codex

agents: {}
